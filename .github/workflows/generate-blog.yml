name: Daily AI Blog Post Generator

on:
  schedule:
    # Runs every day at 8:00 AM UTC (0 8 * * *)
    # Note: Adjust the cron expression if your local time offset is different:
    # e.g., '0 5 * * *' for 8:00 AM UTC+3, or '0 13 * * *' for 8:00 AM UTC-5
    - cron: '0 8 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

permissions:
  contents: write

jobs:
  generate-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci || npm install

      - name: Generate daily AI blog post
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: npm run generate-blog

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add src/data/blogs/
          
          if git diff --staged --quiet; then
            echo "No new blog post to commit."
          else
            git commit -m "feat(blog): auto-generate daily blog post"
            git push origin ${{ github.ref_name }}
          fi
